name: Build iOS App (EAS Cloud)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install
        
    - name: Create standard PNG icons
      run: |
        echo "🎨 Creating standard PNG icons..."
        mkdir -p ios/CryptoLearn/Icons
        # Create icons in standard PNG format
        sips -s format png assets/icon.png --out ios/CryptoLearn/Icons/AppIcon120x120.png
        sips -z 167 167 assets/icon.png --out ios/CryptoLearn/Icons/AppIcon167x167.png
        # Resize to exact dimensions
        sips -z 120 120 ios/CryptoLearn/Icons/AppIcon120x120.png --out ios/CryptoLearn/Icons/AppIcon120x120.png
        sips -z 167 167 ios/CryptoLearn/Icons/AppIcon167x167.png --out ios/CryptoLearn/Icons/AppIcon167x167.png
        # Copy to main app directory
        cp ios/CryptoLearn/Icons/AppIcon120x120.png ios/CryptoLearn/
        cp ios/CryptoLearn/Icons/AppIcon167x167.png ios/CryptoLearn/
        echo "✅ Icons created"
        
    - name: Setup Expo CLI
      run: npm install -g @expo/cli eas-cli
      
    - name: Build with EAS Cloud (proper credentials)
      run: |
        echo "🏗️ Building with EAS Cloud..."
        # Use EAS cloud build which has proper credentials
        npx eas build --platform ios --profile production
        
    - name: Wait for build and download
      run: |
        echo "⏳ Waiting for build to complete..."
        sleep 60
        
        # Get the most recent build
        BUILD_ID=$(eas build:list --limit=1 --platform=ios --status=finished | grep -o '[a-f0-9-]\{36\}' | head -1)
        if [ -n "$BUILD_ID" ]; then
          echo "Found build ID: $BUILD_ID"
          IPA_URL=$(eas build:view "$BUILD_ID" | grep "Application Archive URL" | awk '{print $NF}')
          if [ -n "$IPA_URL" ]; then
            echo "📦 Downloading IPA..."
            curl -L -o CryptoLearn_EAS_CLOUD.ipa "$IPA_URL"
            
            echo "🔍 Verifying IPA..."
            unzip -p CryptoLearn_EAS_CLOUD.ipa Payload/CryptoLearn.app/AppIcon120x120.png | file -
            unzip -p CryptoLearn_EAS_CLOUD.ipa Payload/CryptoLearn.app/AppIcon167x167.png | file -
            
            # Check for provisioning profile
            echo "📋 Checking for provisioning profile..."
            unzip -l CryptoLearn_EAS_CLOUD.ipa | grep "embedded.mobileprovision" && echo "✅ Provisioning profile found" || echo "❌ MISSING: embedded.mobileprovision"
            
            unzip -q CryptoLearn_EAS_CLOUD.ipa
            if [ -f "Payload/CryptoLearn.app/embedded.mobileprovision" ]; then
              echo "✅ Provisioning profile details:"
              security cms -D -i Payload/CryptoLearn.app/embedded.mobileprovision | plutil -p - | grep -E "(Name|Type|Team)" || echo "Could not parse profile"
            fi
            
            codesign -dv Payload/CryptoLearn.app || echo "⚠️ Could not verify signature"
            
            echo "✅ IPA ready!"
          fi
        fi
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-eas-cloud-ipa
        path: CryptoLearn_EAS_CLOUD.ipa
        retention-days: 30
