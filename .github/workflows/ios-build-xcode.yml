name: Build iOS App (Xcode Direct)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install
        npx expo install
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install CocoaPods
      run: |
        cd ios
        pod install
        
    - name: Create standalone PNG icons
      run: |
        echo "🔧 Creating standalone PNG icons..."
        # Create icons in standard PNG format (not CgBI)
        sips -s format png assets/icon.png --out ios/CryptoLearn/AppIcon120x120.png
        sips -z 167 167 assets/icon.png --out ios/CryptoLearn/AppIcon167x167.png
        # Resize to exact dimensions
        sips -z 120 120 ios/CryptoLearn/AppIcon120x120.png --out ios/CryptoLearn/AppIcon120x120.png
        sips -z 167 167 ios/CryptoLearn/AppIcon167x167.png --out ios/CryptoLearn/AppIcon167x167.png
        echo "✅ Standalone icons created"
        
    - name: Verify icon format
      run: |
        echo "🔍 Verifying icon format..."
        file ios/CryptoLearn/AppIcon120x120.png
        file ios/CryptoLearn/AppIcon167x167.png
        
    - name: Build iOS app
      run: |
        cd ios
        xcodebuild -workspace CryptoLearn.xcworkspace \
          -scheme CryptoLearn \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $PWD/build/CryptoLearn.xcarchive \
          -allowProvisioningUpdates \
          archive
          
    - name: Export IPA
      run: |
        cd ios
        # Create export options
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store</string>
          <key>teamID</key>
          <string>M9QP95G3R6</string>
          <key>uploadBitcode</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>destination</key>
          <string>export</string>
          <key>provisioningProfiles</key>
          <dict>
          </dict>
        </dict>
        </plist>
        EOF
        
        # Export IPA
        xcodebuild -exportArchive \
          -archivePath $PWD/build/CryptoLearn.xcarchive \
          -exportPath $PWD/build \
          -exportOptionsPlist ExportOptions.plist
          
    - name: Add standalone icons to IPA
      run: |
        echo "🔧 Adding standalone icons to IPA..."
        cd ios/build
        
        # Extract IPA
        unzip -q CryptoLearn.ipa -d extracted
        
        # Copy standalone icons (already in standard PNG format)
        cp ../CryptoLearn/AppIcon120x120.png extracted/Payload/CryptoLearn.app/
        cp ../CryptoLearn/AppIcon167x167.png extracted/Payload/CryptoLearn.app/
        
        # Re-create IPA (this will break signature, but we'll re-sign)
        cd extracted
        zip -r ../CryptoLearn_Final.ipa Payload/ > /dev/null 2>&1
        cd ..
        
        echo "✅ Final IPA created: CryptoLearn_Final.ipa"
        
    - name: Re-sign IPA with proper certificate
      run: |
        echo "✍️ Re-signing IPA with Apple Distribution certificate..."
        cd ios/build
        
        # Extract IPA
        unzip -q CryptoLearn_Final.ipa -d final_app
        
        # Remove existing signature
        codesign --remove-signature final_app/Payload/CryptoLearn.app
        
        # Find Apple Distribution certificate
        DIST_CERT=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
        
        if [ -z "$DIST_CERT" ]; then
          echo "❌ No Apple Distribution certificate found!"
          echo "Available certificates:"
          security find-identity -v -p codesigning
          # Use Apple Development as fallback
          DIST_CERT=$(security find-identity -v -p codesigning | grep "Apple Development" | head -1 | awk -F'"' '{print $2}')
        fi
        
        echo "Using certificate: $DIST_CERT"
        
        # Re-sign with available certificate
        codesign --force --sign "$DIST_CERT" final_app/Payload/CryptoLearn.app
        
        # Re-create final IPA
        cd final_app
        zip -r ../CryptoLearn_Final_Signed.ipa Payload/ > /dev/null 2>&1
        cd ..
        
        echo "✅ Signed IPA created: CryptoLearn_Final_Signed.ipa"
        
    - name: Verify final IPA
      run: |
        echo "🔍 Verifying final IPA..."
        cd ios/build
        
        # Check icon format
        echo "Checking 120x120 icon:"
        unzip -p CryptoLearn_Final_Signed.ipa "Payload/CryptoLearn.app/AppIcon120x120.png" | file -
        
        echo "Checking 167x167 icon:"
        unzip -p CryptoLearn_Final_Signed.ipa "Payload/CryptoLearn.app/AppIcon167x167.png" | file -
        
        # Check signature
        echo "Checking signature:"
        unzip -q CryptoLearn_Final_Signed.ipa
        codesign -dv Payload/CryptoLearn.app
        spctl -a -v Payload/CryptoLearn.app
        
        # Check bundle info
        echo "Bundle info:"
        plutil -p Payload/CryptoLearn.app/Info.plist | grep -E "(CFBundleIdentifier|CFBundleVersion)"
        
        echo "✅ Verification complete!"
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa-xcode
        path: ios/build/CryptoLearn_Final_Signed.ipa
        retention-days: 30
