name: Build iOS App (Manual Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install
        cd ios && pod install
        
    - name: Create standard PNG icons
      run: |
        echo "🎨 Creating standard PNG icons..."
        mkdir -p ios/CryptoLearn/Icons
        # Use sips (available on macOS)
        sips -s format png assets/icon.png --out ios/CryptoLearn/Icons/AppIcon120x120.png
        sips -z 167 167 assets/icon.png --out ios/CryptoLearn/Icons/AppIcon167x167.png
        # Resize to exact dimensions
        sips -z 120 120 ios/CryptoLearn/Icons/AppIcon120x120.png --out ios/CryptoLearn/Icons/AppIcon120x120.png
        sips -z 167 167 ios/CryptoLearn/Icons/AppIcon167x167.png --out ios/CryptoLearn/Icons/AppIcon167x167.png
        # Copy to main app directory
        cp ios/CryptoLearn/Icons/AppIcon120x120.png ios/CryptoLearn/
        cp ios/CryptoLearn/Icons/AppIcon167x167.png ios/CryptoLearn/
        echo "✅ Icons created"
        
    - name: Update Info.plist with standalone icons
      run: |
        echo "📝 Updating Info.plist..."
        plutil -replace 'CFBundleIconFiles' -json '["AppIcon120x120", "AppIcon167x167"]' ios/CryptoLearn/Info.plist
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build iOS app with Xcode (manual signing)
      run: |
        cd ios
        echo "🏗️ Building with Xcode..."
        xcodebuild -workspace CryptoLearn.xcworkspace \
          -scheme CryptoLearn \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $PWD/build/CryptoLearn.xcarchive \
          -allowProvisioningUpdates \
          archive
          
    - name: Export IPA with App Store signing
      run: |
        cd ios
        echo "📦 Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath $PWD/build/CryptoLearn.xcarchive \
          -exportPath $PWD/build \
          -exportOptionsPlist exportOptions.plist \
          -allowProvisioningUpdates
          
    - name: Add standalone icons to IPA
      run: |
        echo "🔧 Adding standalone icons to IPA..."
        cd ios/build
        
        # Extract IPA
        unzip -q CryptoLearn.ipa -d extracted
        
        # Copy standalone icons
        cp ../CryptoLearn/AppIcon120x120.png extracted/Payload/CryptoLearn.app/
        cp ../CryptoLearn/AppIcon167x167.png extracted/Payload/CryptoLearn.app/
        
        # Re-create IPA
        cd extracted
        zip -r ../CryptoLearn_MANUAL.ipa Payload/ > /dev/null 2>&1
        cd ..
        
        echo "✅ Final IPA created: CryptoLearn_MANUAL.ipa"
        
    - name: Verify final IPA
      run: |
        echo "🔍 Verifying final IPA..."
        cd ios/build
        
        # Check icon format
        echo "Checking 120x120 icon:"
        unzip -p CryptoLearn_MANUAL.ipa "Payload/CryptoLearn.app/AppIcon120x120.png" | file -
        
        echo "Checking 167x167 icon:"
        unzip -p CryptoLearn_MANUAL.ipa "Payload/CryptoLearn.app/AppIcon167x167.png" | file -
        
        # Check for provisioning profile
        echo "📋 Checking for provisioning profile..."
        if unzip -l CryptoLearn_MANUAL.ipa | grep -q "embedded.mobileprovision"; then
          echo "✅ Provisioning profile found!"
          unzip -q CryptoLearn_MANUAL.ipa
          echo "Profile details:"
          security cms -D -i Payload/CryptoLearn.app/embedded.mobileprovision | plutil -p - | grep -E "(Name|Type|Team|UUID)" || echo "Could not parse profile"
        else
          echo "❌ MISSING: embedded.mobileprovision"
          echo "IPA contents:"
          unzip -l CryptoLearn_MANUAL.ipa | head -20
        fi
        
        # Check signature
        echo "Checking signature:"
        unzip -q CryptoLearn_MANUAL.ipa
        codesign -dv Payload/CryptoLearn.app || echo "⚠️ Could not verify signature"
        spctl -a -v Payload/CryptoLearn.app || echo "⚠️ Gatekeeper check failed"
        
        # Check bundle info
        echo "Bundle info:"
        plutil -p Payload/CryptoLearn.app/Info.plist | grep -E "(CFBundleIdentifier|CFBundleVersion)"
        
        echo "✅ Verification complete!"
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-manual-ipa
        path: ios/build/CryptoLearn_MANUAL.ipa
        retention-days: 30
