name: Build iOS App (Simple)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install
        cd ios && pod install
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build iOS app (no signing)
      run: |
        cd ios
        xcodebuild \
          -workspace CryptoLearn.xcworkspace \
          -scheme CryptoLearn \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $PWD/build/CryptoLearn.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          archive
          
    - name: Create IPA with manual icons
      run: |
        cd ios
        # Create IPA directory
        mkdir -p build/Payload
        
        # Copy app from archive to Payload
        cp -r build/CryptoLearn.xcarchive/Products/Applications/CryptoLearn.app build/Payload/
        
        # Manually copy standalone icons
        cp CryptoLearn/AppIcon120x120.png build/Payload/CryptoLearn.app/ 2>/dev/null || echo "120x120 icon not found"
        cp CryptoLearn/AppIcon167x167.png build/Payload/CryptoLearn.app/ 2>/dev/null || echo "167x167 icon not found"
        
        # Create IPA
        cd build
        zip -r CryptoLearn.ipa Payload/
          
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa-simple-icons
        path: ios/build/CryptoLearn.ipa
        retention-days: 30
