name: Build iOS App for App Store - Final Solution

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for build'
        required: false
        default: 'Manual build for App Store submission'
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Expo CLI
      run: npm install -g @expo/cli eas-cli
      
    - name: Install dependencies
      run: npm install
      
    - name: Create standard PNG icons
      run: |
        echo "🎨 Creating standard PNG icons..."
        mkdir -p ios/CryptoLearn/Icons
        # Convert main icon to standard PNG format
        sips -s format png assets/icon.png --out ios/CryptoLearn/Icons/AppIcon120x120.png
        sips -z 167 167 assets/icon.png --out ios/CryptoLearn/Icons/AppIcon167x167.png
        # Copy to main app directory
        cp ios/CryptoLearn/Icons/AppIcon120x120.png ios/CryptoLearn/
        cp ios/CryptoLearn/Icons/AppIcon167x167.png ios/CryptoLearn/
        # Verify formats
        echo "✅ Icon formats:"
        file ios/CryptoLearn/AppIcon120x120.png
        file ios/CryptoLearn/AppIcon167x167.png
        
    - name: Update Info.plist with standalone icon references
      run: |
        echo "📝 Updating Info.plist..."
        plutil -replace 'CFBundleIconFiles' -json '["AppIcon120x120", "AppIcon167x167"]' ios/CryptoLearn/Info.plist
        
    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build iOS App Archive
      run: |
        cd ios
        echo "🏗️ Building iOS archive..."
        xcodebuild -workspace CryptoLearn.xcworkspace \
          -scheme CryptoLearn \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $PWD/build/CryptoLearn.xcarchive \
          archive \
          CODE_SIGN_STYLE=Manual \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGN_IDENTITY="" \
          -allowProvisioningUpdates
          
    - name: Export IPA with App Store signing
      run: |
        cd ios
        echo "📦 Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath $PWD/build/CryptoLearn.xcarchive \
          -exportPath $PWD/build \
          -exportOptionsPlist exportOptions.plist \
          -allowProvisioningUpdates
          
    - name: Verify IPA before upload
      run: |
        cd ios/build
        echo "🔍 Verifying IPA..."
        IPA_FILE=$(ls *.ipa | head -1)
        echo "Found IPA: $IPA_FILE"
        
        # Check icon presence
        echo "📋 Checking icon presence:"
        unzip -l "$IPA_FILE" | grep -E "(AppIcon.*\.png|Info\.plist)" || echo "⚠️ Icons not found in expected location"
        
        # Check icon formats
        echo "🎨 Checking icon formats:"
        unzip -p "$IPA_FILE" Payload/CryptoLearn.app/AppIcon120x120.png 2>/dev/null | file - || echo "⚠️ AppIcon120x120.png not found"
        unzip -p "$IPA_FILE" Payload/CryptoLearn.app/AppIcon167x167.png 2>/dev/null | file - || echo "⚠️ AppIcon167x167.png not found"
        
        # Check signature
        echo "✍️ Checking signature:"
        unzip -q "$IPA_FILE"
        codesign -dv Payload/CryptoLearn.app || echo "⚠️ Signature verification failed"
        spctl -a -v Payload/CryptoLearn.app || echo "⚠️ Gatekeeper verification failed"
        
        # Check bundle info
        echo "📱 Bundle info:"
        plutil -p Payload/CryptoLearn.app/Info.plist | grep -E "(CFBundleIdentifier|CFBundleVersion)"
        
        echo "✅ Verification complete!"
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa-final
        path: ios/build/*.ipa
        retention-days: 30
        
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          ios/build/*.log
          ~/Library/Logs/xcodebuild/*.log
        retention-days: 7
        
    - name: Create Release Summary
      run: |
        echo "## 🎉 iOS Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Build Details:" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform**: iOS" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration**: Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Signing**: App Store Distribution" >> $GITHUB_STEP_SUMMARY
        echo "- **Icons**: Standard PNG format" >> $GITHUB_STEP_SUMMARY
        echo "- **Bundle ID**: com.cryptolearn.app" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "- Download the IPA from the Artifacts section below" >> $GITHUB_STEP_SUMMARY
        echo "- Ready for Transporter upload" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the IPA" >> $GITHUB_STEP_SUMMARY
        echo "2. Upload to Transporter" >> $GITHUB_STEP_SUMMARY
        echo "3. Submit to App Store" >> $GITHUB_STEP_SUMMARY
